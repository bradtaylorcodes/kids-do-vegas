name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PAYLOAD_SECRET: ci-secret
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/kidsdovegas
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/kidsdovegas_test

jobs:
  checks:
    name: Typecheck, lint, integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kidsdovegas
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Committed migrations match the config
        run: |
          pnpm migrate:create drift-check --skip-empty
          if [ -n "$(git status --porcelain --untracked-files=all src/migrations)" ]; then
            echo "::error::Schema changes have no migration. Run 'pnpm migrate:create <name>' and commit it."
            git status --porcelain --untracked-files=all src/migrations
            exit 1
          fi
      - run: pnpm test

  e2e:
    name: Production build and end-to-end tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kidsdovegas
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # NODE_ENV=production makes Playwright's `pnpm seed` rebuild the database
      # from the committed migrations, as previews and production do.
      - run: pnpm test:e2e
        env:
          NODE_ENV: production
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
